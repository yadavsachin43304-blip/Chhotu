name: Build Chhotu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk Chhotu-debug-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chhotu-debug-apk
          path: Chhotu-debug-*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chhotu build ${{ github.run_number }}
          files: Chhotu-debug-*.apk
          body: Chhotu ka debug APK. Phone me download karke install karo (Unknown sources allow karna padega).
