name: Test Chhotu on emulator

on:
  push:
    branches: [ 'v0.6-dev' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true; df -h /
      - name: Download sherpa-onnx
        run: mkdir -p app/libs && curl -sSL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
      - name: Download models
        run: |
          mkdir -p models && cd models
          curl -sSL -o chhotu-brain-gemma4-universal.litertlm https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
          curl -sSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2 | tar xj
          echo ok > kokoro-int8-multi-lang-v1_0/done.flag
          ls -la
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build app + test APKs
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 14G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/run-emulator-test.sh
      - name: Report
        if: always()
        run: cat test-report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chhotu-test-report
          path: |
            test-report.txt
            logcat.txt
